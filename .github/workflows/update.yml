name: Update Bioconductor Metadata

on:
  schedule:
    - cron: "0 6 * * *"
    # Catch-up. Does nothing unless the day's primary run failed to finish, so a
    # transient upstream outage costs a few hours rather than the whole day.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Full cold crawl of all bioc repos (ignore the prior catalog). Slow; use once."
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: bioconductor-metadata-update
  cancel-in-progress: false

jobs:
  # The workflow-level concurrency group means a catch-up run queues behind a
  # primary that is still going, so by the time this job runs the primary has
  # always concluded and its result can simply be read off.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
          SELF: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Every trigger except the catch-up cron always runs.
          if [ "$SCHEDULE" != "0 11 * * *" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail OPEN. This runs only on the catch-up cron, which exists because
          # the day's data is already at risk, so an Actions API blip must not be
          # what throws the last attempt away. A redundant catch-up costs one run;
          # a skipped one costs the day.
          DONE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update.yml \
                   --status success --created "$(date -u +%Y-%m-%d)" --limit 50 \
                   --json databaseId \
                   --jq "[.[] | select(.databaseId != $SELF)] | length" 2>/dev/null) || DONE=""
          case "$DONE" in
            ''|*[!0-9]*)
              echo "Could not read today's run history; running the catch-up rather than risking the day."
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [ "$DONE" -gt 0 ]; then
            echo "Today's update already succeeded; nothing to catch up."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful update today; running the catch-up."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RSQLite
            any::DBI
            any::jsonlite
            any::yaml
            any::testthat
            any::withr
            any::curl
      - name: Run unit tests
        run: Rscript tests/testthat.R
      - name: Build catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          if [ "${{ inputs.bootstrap }}" = "true" ]; then
            Rscript scripts/update.R out/ --bootstrap
          else
            Rscript scripts/update.R out/
          fi
      - name: Publish to the "current" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CHANGED=$(jq -r '.changed' out/manifest.json)
          if ! gh release view current >/dev/null 2>&1; then
            git tag -f current
            git push -f origin current || true
            gh release create current --title "Bioconductor Metadata (rolling)" --notes "Rolling catalog of Bioconductor package metadata, authors, and release lineage." --latest
            CHANGED=true
          fi
          if [ "$CHANGED" = "true" ]; then
            gh release upload current out/bioconductor-metadata.db --clobber
            gh release upload current out/manifest.json --clobber
          fi

  keepalive:
    # GitHub disables a public repository's scheduled workflows after 60 days
    # without repository activity. Publishing a release does not count and a
    # commit does, so this commits a timestamp. It is its own job so a failed or
    # timed-out update still keeps the schedule alive.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # The work takes seconds; the rest is headroom for a slow runner start.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Update last run timestamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for _ in 1 2 3; do
            # Decide against main as it is now, not the commit this run started
            # from, so a re-run, a queued run or a push that lands meanwhile
            # finds the newer commit and stops here instead of conflicting.
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
            # A commit a day is far inside the 60-day window, so skip when main
            # already has a commit from the last 20 hours.
            if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -lt 72000 ]; then
              echo "main already has a commit from the last 20 hours"
              exit 0
            fi
            echo "Last updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > last-updated.txt
            git add last-updated.txt
            git commit -m "chore: update last run time"
            git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
